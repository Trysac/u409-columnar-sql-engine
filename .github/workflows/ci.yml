# Thin wrapper around the local gates (scripts/check). The gates themselves live in the repo;
# this workflow only re-runs them. Every job is skipped while the repository is private.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    if: ${{ !github.event.repository.private }}
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # gitleaks runs in its own job below with the official action.
      FABRICA_ALLOW_MISSING_GITLEAKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - run: go mod download
      - run: go run ./scripts/check

  # CI-only tier: the full suite, including the tests tagged conformance (external tools or downloads).
  # The gates job above runs exactly the local tier, so its coverage is the one the factory measured.
  conformance:
    if: ${{ !github.event.repository.private }}
    name: conformance (full suite)
    runs-on: ubuntu-latest
    env:
      FABRICA_ALLOW_MISSING_GITLEAKS: "1"
      FABRICA_CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - run: go mod download
      # Optional, project-provided tool installation for the conformance tier. Only CI runs it, never
      # the factory or the local gates. Downloads must be verified against a pinned SHA-256.
      - name: conformance tools (ci/conformance-setup.sh, optional)
        shell: bash
        run: |
          if [ -f ci/conformance-setup.sh ]; then bash ci/conformance-setup.sh; else echo "no ci/conformance-setup.sh"; fi
      - run: go run ./scripts/check

  secrets:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed if the repository belongs to a GitHub organization (free for personal accounts).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
